name: Validate unique URL domains

on:
  push:
    branches: [main]
    paths:
      - url-candidates.txt
      - .github/workflows/validate-unique-url-domains.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests tldextract
      - name: Validate and select 100 URLs
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          import tldextract

          ORIGIN = 'https://weizhiok.github.io'
          MAX_BYTES = 5120
          TIMEOUT = 5
          extractor = tldextract.TLDExtract(suffix_list_urls=())

          candidates = [line.strip() for line in Path('url-candidates.txt').read_text().splitlines() if line.strip()]

          def root_domain(url):
              host = (urlparse(url).hostname or '').lower()
              ext = extractor(host)
              return ext.top_domain_under_public_suffix or host

          def check(item):
              index, url = item
              started = time.monotonic()
              result = {'index': index, 'url': url, 'input_domain': root_domain(url), 'ok': False}
              try:
                  response = requests.get(
                      url,
                      headers={
                          'Origin': ORIGIN,
                          'Accept': 'application/dns-json, application/json, text/plain, image/*, */*',
                          'User-Agent': 'weizhiok-gg-url-validator/1.0'
                      },
                      timeout=TIMEOUT,
                      allow_redirects=True,
                      stream=True
                  )
                  result['status'] = response.status_code
                  result['final_url'] = response.url
                  result['final_domain'] = root_domain(response.url)
                  result['cors'] = response.headers.get('access-control-allow-origin', '')
                  if not 200 <= response.status_code < 300:
                      raise ValueError(f'HTTP {response.status_code}')
                  if urlparse(response.url).scheme != 'https':
                      raise ValueError('final URL is not HTTPS')
                  allowed = [part.strip() for part in result['cors'].split(',')]
                  if '*' not in allowed and ORIGIN not in allowed:
                      raise ValueError('CORS does not allow the GitHub Pages origin')
                  declared = response.headers.get('content-length')
                  if declared and declared.isdigit() and int(declared) > MAX_BYTES:
                      raise ValueError(f'Content-Length {declared} exceeds {MAX_BYTES}')
                  size = 0
                  for chunk in response.iter_content(chunk_size=1024):
                      size += len(chunk)
                      if size > MAX_BYTES:
                          raise ValueError(f'body exceeds {MAX_BYTES} bytes')
                  elapsed = time.monotonic() - started
                  result['bytes'] = size
                  result['seconds'] = round(elapsed, 3)
                  if not size:
                      raise ValueError('empty body')
                  if elapsed > TIMEOUT:
                      raise ValueError(f'elapsed {elapsed:.3f}s exceeds {TIMEOUT}s')
                  result['ok'] = True
              except Exception as error:
                  result['seconds'] = round(time.monotonic() - started, 3)
                  result['reason'] = str(error)
              return result

          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
              results = list(pool.map(check, enumerate(candidates)))

          results.sort(key=lambda item: item['index'])
          selected = []
          used_input = set()
          used_final = set()
          for item in results:
              if not item['ok']:
                  continue
              if item['input_domain'] in used_input or item['final_domain'] in used_final:
                  item['ok'] = False
                  item['reason'] = 'duplicate registrable domain'
                  continue
              used_input.add(item['input_domain'])
              used_final.add(item['final_domain'])
              selected.append(item)
              if len(selected) == 100:
                  break

          report = {
              'generated_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'origin': ORIGIN,
              'timeout_seconds': TIMEOUT,
              'max_body_bytes': MAX_BYTES,
              'candidate_count': len(candidates),
              'selected_count': len(selected),
              'selected': selected,
              'results': results
          }
          Path('url-validation-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')

          if len(selected) < 100:
              print(f'Only {len(selected)} unique domains passed validation.')
              raise SystemExit(2)

          Path('url.txt').write_text('\n'.join(item['url'] for item in selected) + '\n')
          print('Selected 100 validated URLs with 100 distinct registrable domains.')
          PY
      - name: Commit validation result
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add url-validation-report.json
          if [ -f url.txt ] && [ "$(python -c "import json; print(json.load(open('url-validation-report.json'))['selected_count'])")" = "100" ]; then
            git add url.txt
          fi
          git diff --cached --quiet || git commit -m "Validate 100 unique URL domains [skip ci]"
          git push
